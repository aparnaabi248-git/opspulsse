# ─── OpsPulse frontend (nginx) ─────────────────────────────────────
# Serves the built React app and proxies the API + Socket.IO so the
# browser only ever talks to one origin.

upstream opspulse_api {
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://opspulse_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Socket.IO ────────────────────────────────────────────────────
    # `upgrade` must be in the map for the WebSocket handshake to work.
    location /socket.io/ {
        proxy_pass http://opspulse_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the connection open long enough for an idle live dashboard
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Static assets ────────────────────────────────────────────────
    # Hashed filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    # index.html must never be cached, otherwise a deploy leaves stale JS.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}